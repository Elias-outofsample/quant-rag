[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-rag"
version = "1.4.0"
description = "Retrieval over a closed quantitative-finance library: measured retrieval choices, verifiable citations, MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary (all rights reserved)" }
authors = [{ name = "Elias-outofsample" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "mcp[cli]>=2.2",
    "pypdf>=4",
]

[project.optional-dependencies]
# embedding (Qwen3-Embedding-0.6B), cross-encoder rerankers - needed to serve queries
models = ["torch>=2.3", "sentence-transformers>=3.0", "transformers>=4.51"]
# entity-graph extraction
graph = ["gliner2"]
# statistics of the v4 benchmark
bench = ["scipy>=1.11"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "scipy>=1.11"]

[tool.setuptools]
# script-style layout: modules are run from rag/ and resolve their paths from __file__
packages = []

[tool.pytest.ini_options]
testpaths = ["rag", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"
